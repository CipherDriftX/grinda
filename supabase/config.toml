# Supabase project config for Steppie (used by `supabase start` / `supabase deploy`).
project_id = "steppie"

[api]
enabled = true
port = 54321
schemas = ["public"]

[auth]
enabled = true
site_url = "steppie://auth"

[auth.external.apple]
enabled = true
# Bundle ID of the iOS app; native Sign in with Apple uses id_token exchange.
client_id = "com.cipherdriftx.steppie"
secret = ""

# Functions called by Whop, pg_cron or anonymous visitors don't carry a user JWT.
[functions.whop-webhook]
verify_jwt = false

[functions.settle]
verify_jwt = false

[functions.public-stats]
verify_jwt = false

# Apple calls this; the body is only a pointer and the status is read back from Apple.
[functions.app-store-notifications]
verify_jwt = false

# The review desk: guarded by ADMIN_SECRET, not a user login.
[functions.admin-review]
verify_jwt = false
