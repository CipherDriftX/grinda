name: Grinda
options:
  bundleIdPrefix: com.cipherdriftx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${GRINDA_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: "24.0.0"
targets:
  Grinda:
    type: application
    platform: iOS
    sources:
      - path: Grinda
    resources: []
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - target: GrindaWidget
        embed: true
    entitlements:
      path: Grinda/Grinda.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.cipherdriftx.grinda]
        com.apple.developer.in-app-payments: [merchant.com.cipherdriftx.grinda]
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: Grinda/Info.plist
      properties:
        CFBundleDisplayName: Grinda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.cipherdriftx.grinda
            CFBundleURLSchemes: [grinda]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - GrindaBib-Black.ttf
          - GrindaBib-Bold.ttf
          - GrindaWide-Black.ttf
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.cipherdriftx.grinda.refresh]
        NSHealthShareUsageDescription: "Grinda reads your steps, walking distance and body weight from Apple Health to track your races and show your progress. Your health data is never used for advertising."
        NSHealthUpdateUsageDescription: "Grinda can save the weight you log in the app to Apple Health so all your data stays in one place."
        GrindaSupabaseURL: $(GRINDA_SUPABASE_URL)
        GrindaSupabaseAnonKey: $(GRINDA_SUPABASE_ANON_KEY)
        GrindaStripePublishableKey: $(GRINDA_STRIPE_PUBLISHABLE_KEY)
        GrindaAppGroup: group.com.cipherdriftx.grinda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cipherdriftx.grinda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  GrindaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GrindaWidget
      - path: Grinda/DesignSystem/Palette.swift
      - path: Grinda/Models/WidgetSnapshot.swift
      - path: Grinda/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: GrindaWidget/GrindaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cipherdriftx.grinda]
    info:
      path: GrindaWidget/Info.plist
      properties:
        CFBundleDisplayName: Grinda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - GrindaBib-Black.ttf
          - GrindaBib-Bold.ttf
        GrindaAppGroup: group.com.cipherdriftx.grinda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cipherdriftx.grinda.widget
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Grinda:
    build:
      targets:
        Grinda: all
    run:
      config: Debug
    archive:
      config: Release
