name: Steppie
options:
  bundleIdPrefix: com.cipherdriftx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${STEPPIE_TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: "24.0.0"
targets:
  Steppie:
    type: application
    platform: iOS
    sources:
      - path: Steppie
    resources: []
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - target: SteppieWidget
        embed: true
    entitlements:
      path: Steppie/Steppie.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.cipherdriftx.steppie]
        com.apple.developer.in-app-payments: [merchant.com.cipherdriftx.steppie]
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: Steppie/Info.plist
      properties:
        CFBundleDisplayName: Steppie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.cipherdriftx.steppie
            CFBundleURLSchemes: [steppie]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - SteppieBib-Black.ttf
          - SteppieBib-Bold.ttf
          - SteppieWide-Black.ttf
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.cipherdriftx.steppie.refresh]
        NSHealthShareUsageDescription: "Steppie reads your steps, walking distance and body weight from Apple Health to track your races and show your progress. Your health data is never used for advertising."
        NSHealthUpdateUsageDescription: "Steppie can save the weight you log in the app to Apple Health so all your data stays in one place."
        SteppieSupabaseURL: $(STEPPIE_SUPABASE_URL)
        SteppieSupabaseAnonKey: $(STEPPIE_SUPABASE_ANON_KEY)
        SteppieStripePublishableKey: $(STEPPIE_STRIPE_PUBLISHABLE_KEY)
        SteppieAppGroup: group.com.cipherdriftx.steppie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cipherdriftx.steppie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Stride
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  SteppieWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SteppieWidget
      - path: Steppie/DesignSystem/Palette.swift
      - path: Steppie/DesignSystem/Mascot.swift
      - path: Steppie/DesignSystem/MascotArt.swift
      - path: Steppie/DesignSystem/Motion.swift
      - path: Steppie/Models/Models.swift
      - path: Steppie/Models/WidgetSnapshot.swift
      - path: Steppie/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: SteppieWidget/SteppieWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cipherdriftx.steppie]
    info:
      path: SteppieWidget/Info.plist
      properties:
        CFBundleDisplayName: Steppie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - SteppieBib-Black.ttf
          - SteppieBib-Bold.ttf
        SteppieAppGroup: group.com.cipherdriftx.steppie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cipherdriftx.steppie.widget
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Steppie:
    build:
      targets:
        Steppie: all
    run:
      config: Debug
    archive:
      config: Release
